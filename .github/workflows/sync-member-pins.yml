# Keep each apps/<slug> submodule at the commit Clawnify has verified for
# that member, so the folder on GitHub shows the same commit an install
# deploys. Install itself never reads these folders; this is provenance.
name: Sync member pins

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Move gitlinks to the verified commits
        id: sync
        run: |
          set -euo pipefail
          changed=()
          while read -r key path; do
            name="${key#submodule.}"; name="${name%.path}"
            url="$(git config -f .gitmodules --get "submodule.${name}.url")"
            repo="$(echo "$url" | sed -E 's#^https://github.com/##; s#\.git$##')"
            sha="$(curl -sf "https://provision.clawnify.com/deploy/verification?repo=${repo}" \
              | jq -r 'select(.status == "approved") | .verified_sha // empty')"
            if [ -z "$sha" ]; then echo "${repo}: not approved, left as is"; continue; fi
            current="$(git ls-tree HEAD "$path" | awk '{print $3}')"
            if [ "$current" = "$sha" ]; then echo "${path}: up to date (${sha:0:7})"; continue; fi
            git update-index --cacheinfo "160000,${sha},${path}"
            echo "${path}: ${current:0:7} -> ${sha:0:7}"
            changed+=("${path##*/}@${sha:0:7}")
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')
          if [ "${#changed[@]}" -eq 0 ]; then echo "changed=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=${changed[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.sync.outputs.changed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "apps/: sync member pins (${{ steps.sync.outputs.changed }})"
          git push
